name: Tests and distributions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check simplevo tests examples
      - run: python -m pytest -q
      - run: python -m simplevo toy --out runs/toy
      - run: python examples/toy_adaptation.py runs/toy-api

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[test]" numpy==1.24.0 Pillow==10.0.0 PyYAML==6.0.2 pytest==8.0.0
      - run: python -m pytest -q

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build "twine>=6,<7"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Build a wheel from the source archive
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          tar -xzf dist/simplevo-*.tar.gz -C "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source"/simplevo-*
          test -f tests/fake_codex.py
          test -f examples/toy_adaptation.py
          test -f docs/ADAPTER.md
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels"
      - name: Test installed wheel outside the source tree
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install "$RUNNER_TEMP"/wheels/*.whl "pytest>=8,<10"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pytest -c /dev/null "$GITHUB_WORKSPACE/tests" -q
          "$RUNNER_TEMP/wheel-env/bin/simplevo" toy --out wheel-toy
          "$RUNNER_TEMP/wheel-env/bin/python" "$GITHUB_WORKSPACE/examples/toy_adaptation.py" wheel-api

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --only-binary=pybullet -e ".[playground,test]"
      - run: python -m pytest tests/test_playground.py -q
