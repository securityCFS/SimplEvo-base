[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simplevo"
version = "1.0.0"
description = "SimplEvo core: direct robot control by an MLLM with a task memory and a self-written working memory"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<13"]

[project.urls]
Paper = "https://arxiv.org/abs/2611.11509"
Repository = "https://github.com/securityCFS/SimplEvo-base"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
simplevo = "simplevo.cli:main"

[tool.setuptools.packages.find]
include = ["simplevo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
