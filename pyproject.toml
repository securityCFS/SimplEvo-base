[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simplevo"
version = "1.0.0"
description = "SimplEvo core: direct robot control by an MLLM with a task memory and a self-written working memory"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<13", "PyYAML>=6.0.2,<7"]
keywords = ["robotics", "embodied-ai", "memory", "multimodal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Paper = "https://arxiv.org/abs/2611.11509"
Repository = "https://github.com/securityCFS/SimplEvo-base"
Issues = "https://github.com/securityCFS/SimplEvo-base/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.11,<1", "twine>=6,<7"]

[project.scripts]
simplevo = "simplevo.cli:main"

[tool.setuptools.package-data]
simplevo = ["defaults.yaml"]

[tool.setuptools.packages.find]
include = ["simplevo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 119
extend-exclude = ["runs", "outputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
